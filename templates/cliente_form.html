{{define "cliente_form.html"}}
<!doctype html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>{{if .Cliente.ID}}Editar cliente{{else}}Nuevo cliente{{end}}</title>
	<link rel="stylesheet" href="/static/style.css">
</head>
<body>
	<header>
		<h1>{{if .Cliente.ID}}Editar cliente{{else}}Nuevo cliente{{end}}</h1>
		<a class="btn" href="/clientes">Volver al listado</a>
	</header>
	<main>
		<form action="{{.Accion}}" method="POST" class="form">
			<label>
				Nombre
				<input type="text" name="nombre" value="{{.Cliente.Nombre}}" required>
			</label>
			<label>
				Apellido
				<input type="text" name="apellido" value="{{.Cliente.Apellido}}" required>
			</label>
			<label>
				Email
				<input type="email" name="email" value="{{.Cliente.Email}}" required>
			</label>
			<label>
				Teléfono
				<input type="text" name="telefono" value="{{.Cliente.Telefono}}">
			</label>
			<label>
				Dirección
				<input type="text" name="direccion" value="{{.Cliente.Direccion}}">
			</label>
			<button type="submit">Guardar</button>
		</form>
	</main>
</body>
</html>
{{end}}
